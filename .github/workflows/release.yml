name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun ci

      - name: Build
        run: bun run build

      - name: Create ZIP
        working-directory: dist
        run: |
          zip -r "../${{ github.event.repository.name }}-${GITHUB_REF_NAME}.zip" .

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "${{ github.event.repository.name }}-${GITHUB_REF_NAME}.zip" \
            --title "${GITHUB_REF_NAME}" \
            --verify-tag \
            --generate-notes
